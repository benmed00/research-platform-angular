<div class="environmental-data-container">
  <app-page-header
    title="Données Environnementales"
    subtitle="Qualité de l'eau, air, climat et géologie"
    icon="water_drop"
  >
  </app-page-header>

  <app-loading-spinner *ngIf="loading"></app-loading-spinner>

  <app-data-table
    *ngIf="!loading"
    [columns]="columnLabels"
    [data]="readings"
    [displayedColumns]="displayedColumns"
  >
  </app-data-table>
</div>
