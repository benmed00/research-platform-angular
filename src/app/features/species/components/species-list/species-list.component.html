<div class="species-container">
  <app-page-header
    title="Base de Données - Espèces"
    subtitle="Catalogue des espèces étudiées"
    icon="eco"
  >
  </app-page-header>

  <app-loading-spinner *ngIf="loading"></app-loading-spinner>

  <app-data-table
    *ngIf="!loading"
    [columns]="columnLabels"
    [data]="species"
    [displayedColumns]="displayedColumns"
  >
  </app-data-table>
</div>
