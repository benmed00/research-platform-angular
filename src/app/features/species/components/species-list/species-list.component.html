<div class="species-container">
  <app-page-header
    title="Base de Données - Espèces"
    subtitle="Catalogue des espèces étudiées"
    icon="eco"
  >
  </app-page-header>

  @if (loading) {
    <app-loading-spinner></app-loading-spinner>
  }

  @if (!loading) {
    <app-data-table [columns]="columnLabels" [data]="species" [displayedColumns]="displayedColumns">
    </app-data-table>
  }
</div>
