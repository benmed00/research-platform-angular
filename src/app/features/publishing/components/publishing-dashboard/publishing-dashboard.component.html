<div class="publishing-container">
  <app-page-header
    title="Édition & Publication"
    subtitle="Préparation et diffusion des publications"
    icon="menu_book"
  >
  </app-page-header>

  <app-loading-spinner *ngIf="loading"></app-loading-spinner>

  <app-data-table
    *ngIf="!loading"
    [columns]="columnLabels"
    [data]="publications"
    [displayedColumns]="displayedColumns"
  >
  </app-data-table>
</div>
