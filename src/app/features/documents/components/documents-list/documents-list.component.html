<div class="documents-container">
  <app-page-header
    title="Gestion Documentaire"
    subtitle="Rapports, données et publications"
    icon="folder"
  >
  </app-page-header>

  @if (loading) {
    <app-loading-spinner></app-loading-spinner>
  }

  @if (!loading) {
    <app-data-table
      [columns]="columnLabels"
      [data]="documents"
      [displayedColumns]="displayedColumns"
    >
    </app-data-table>
  }
</div>
