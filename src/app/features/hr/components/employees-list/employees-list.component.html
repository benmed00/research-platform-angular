<div class="hr-container">
  <app-page-header
    title="Ressources Humaines"
    subtitle="Gestion des employés et contrats"
    icon="work"
  >
  </app-page-header>

  @if (loading) {
    <app-loading-spinner></app-loading-spinner>
  }

  @if (!loading) {
    <app-data-table
      [columns]="columnLabels"
      [data]="employees"
      [displayedColumns]="displayedColumns"
    >
    </app-data-table>
  }
</div>
