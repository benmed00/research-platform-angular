<div class="user-form-container">
  <app-page-header
    [title]="isEditMode ? 'Modifier un utilisateur' : 'Nouvel utilisateur'"
    [subtitle]="
      isEditMode ? 'Mettre à jour le profil et les permissions' : 'Créer un compte utilisateur'
    "
    icon="person_add"
  >
  </app-page-header>

  @if (loading) {
    <app-loading-spinner></app-loading-spinner>
  }

  @if (!loading) {
    <mat-card>
      <mat-card-content>
        @if (error) {
          <p class="form-error">{{ error }}</p>
        }

        <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="user-form">
          <div class="form-row">
            <mat-form-field appearance="outline">
              <mat-label>Prénom</mat-label>
              <input matInput formControlName="firstName" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Nom</mat-label>
              <input matInput formControlName="lastName" />
            </mat-form-field>
          </div>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Rôle</mat-label>
            <mat-select formControlName="role">
              @for (option of roleOptions; track option.value) {
                <mat-option [value]="option.value">{{ option.label }}</mat-option>
              }
            </mat-select>
          </mat-form-field>

          <mat-checkbox formControlName="isActive">Compte actif</mat-checkbox>

          <div class="form-actions">
            <button mat-button type="button" (click)="onCancel()" [disabled]="saving">
              Annuler
            </button>
            <button
              mat-raised-button
              color="primary"
              type="submit"
              [disabled]="userForm.invalid || saving"
            >
              @if (saving) {
                Enregistrement...
              } @else {
                {{ isEditMode ? 'Mettre à jour' : 'Créer' }}
              }
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  }
</div>
