<div class="missions-container">
  <app-page-header
    title="Missions & Campagnes"
    subtitle="Gestion des missions terrain"
    icon="explore"
  >
  </app-page-header>

  <app-loading-spinner *ngIf="loading"></app-loading-spinner>

  <app-data-table
    *ngIf="!loading"
    [columns]="columnLabels"
    [data]="missions"
    [displayedColumns]="displayedColumns"
  >
  </app-data-table>
</div>
