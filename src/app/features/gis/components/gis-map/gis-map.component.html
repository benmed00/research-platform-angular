<div class="gis-container">
  <app-page-header
    title="SIG & Cartographie"
    subtitle="Visualisation géospatiale des données"
    icon="map"
  >
  </app-page-header>

  <app-loading-spinner *ngIf="loading"></app-loading-spinner>

  <app-data-table
    *ngIf="!loading"
    [columns]="columnLabels"
    [data]="layers"
    [displayedColumns]="displayedColumns"
  >
  </app-data-table>
</div>
