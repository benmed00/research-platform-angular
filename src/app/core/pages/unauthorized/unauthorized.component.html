<div class="unauthorized-container">
  <mat-card>
    <mat-card-header>
      <mat-icon mat-card-avatar color="warn">block</mat-icon>
      <mat-card-title>Accès refusé</mat-card-title>
      <mat-card-subtitle
        >Vous n'avez pas les permissions nécessaires pour accéder à cette page.</mat-card-subtitle
      >
    </mat-card-header>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="goBack()">
        Retour au tableau de bord
      </button>
    </mat-card-actions>
  </mat-card>
</div>
